<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>METAR Board — Charts</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#062a8a; --panel:#041f66; --panel2:#0733a5;
    --line:#b9d3ff; --text:#eaf2ff; --cyan:#80d7ff; --yellow:#ffe26b;
    --red:#ff5c5c; --green:#3dff9a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:18px;background:linear-gradient(180deg,#041a55 0%,#031445 55%,#020f36 100%);color:var(--text);font-family:var(--sans)}
  .frame{border:2px solid var(--line);background:rgba(0,0,0,.06);box-shadow:0 16px 60px rgba(0,0,0,.35)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-bottom:2px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02))}
  .title{font-family:var(--mono);font-weight:700;letter-spacing:.8px;font-size:18px;color:var(--yellow);text-transform:uppercase}
  .muted{color:rgba(234,242,255,.75);font-family:var(--mono);font-size:12px;margin-top:2px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12px}
  select,button,input,a.pill{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:rgba(0,0,0,.10);color:var(--text);padding:6px 8px;border-radius:3px;outline:none;text-decoration:none;white-space:nowrap}
  button:hover,a.pill:hover{background:rgba(255,255,255,.08);cursor:pointer}
  input{min-width:150px}

  .ap{border-bottom:1px solid rgba(185,211,255,.55)}
  .aphead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 12px;background:rgba(0,0,0,.12);border-bottom:1px solid rgba(185,211,255,.35)}
  .icao{font-family:var(--mono);font-weight:900;font-size:18px;letter-spacing:1.2px;color:var(--cyan)}
  .apname{font-family:var(--mono);font-size:13px;color:var(--text);text-transform:uppercase}
  .cnt{font-family:var(--mono);font-size:11px;color:rgba(234,242,255,.65);margin-left:auto}
  .none .icao{color:rgba(128,215,255,.5)}
  .nonemsg{padding:8px 12px;font-family:var(--mono);font-size:12px;color:rgba(234,242,255,.55)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;padding:10px 12px}
  .chart{display:flex;align-items:center;gap:8px;text-align:left;width:100%;padding:8px 10px;font-size:13px;letter-spacing:.3px}
  .chart .n{color:rgba(234,242,255,.5);min-width:20px}
  .chart .t{flex:1;white-space:normal;word-break:break-word}
  .tag{font-size:10px;padding:1px 4px;border:1px solid currentColor;border-radius:2px;letter-spacing:.5px}
  .tag.ad{color:var(--green)} .tag.wpt{color:rgba(234,242,255,.6)} .tag.apch{color:var(--yellow)} .tag.sid{color:var(--cyan)}

  .foot{padding:10px 12px;border-top:2px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;background:rgba(0,0,0,.10);font-family:var(--mono);font-size:12px;color:rgba(234,242,255,.78)}

  /* viewer */
  #viewer{display:none;position:fixed;inset:0;z-index:10;background:rgba(2,10,40,.96);flex-direction:column}
  #viewer.open{display:flex}
  .vbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:2px solid var(--line);background:var(--panel)}
  .vtitle{font-family:var(--mono);font-weight:700;color:var(--yellow);flex:1;min-width:160px}
  #frame{flex:1;width:100%;border:0;background:#fff}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div>
      <div class="title">Charts — Aerodrome &amp; Procedures</div>
      <div class="muted">ET CENOR FLIP VOL II 01 OCT 2026 (AIRAC 2610) • sorted by document outline</div>
    </div>
    <div class="controls">
      <a class="pill" href="./">&larr; METAR BOARD</a>
      <select id="setSelect" title="Station set"></select>
      <input id="q" type="search" placeholder="filter: RWY 25, TACAN, RNP…">
    </div>
  </div>
  <div id="list"></div>
  <div class="foot">
    <div>Charts: <span id="totalCnt"></span></div>
    <div>Keys in viewer: &larr; &rarr; = prev/next • Esc = close</div>
  </div>
</div>

<div id="viewer">
  <div class="vbar">
    <button id="vPrev">&larr; PREV</button>
    <button id="vNext">NEXT &rarr;</button>
    <div class="vtitle" id="vTitle"></div>
    <a class="pill" id="vOpen" target="_blank" rel="noopener">OPEN / DOWNLOAD</a>
    <button id="vClose">CLOSE ✕</button>
  </div>
  <iframe id="frame" title="Chart"></iframe>
</div>

  const BASE = "charts/";

  const setSelect = document.getElementById("setSelect");
  const listEl = document.getElementById("list");
  const q = document.getElementById("q");

  const ALL = [...new Set(Object.values(STATION_PRESETS).flat())];
  const SETS = { ALL, ...STATION_PRESETS };
  for (const k of Object.keys(SETS)) {
    const o = document.createElement("option");
    o.value = k; o.textContent = k.replace("_", " ");
    setSelect.appendChild(o);
  }
  setSelect.value = localStorage.getItem("chartsSet") || "ALL";
  if (!SETS[setSelect.value]) setSelect.value = "ALL";

  function tagOf(t){
    if (/^AERODROME CHART/i.test(t)) return ["ad","AD"];
    if (/^WAYPOINT LIST/i.test(t)) return ["wpt","WPT"];
    if (/\bSID\b/i.test(t)) return ["sid","SID"];
    if (/\bRWY\b/i.test(t) && /(RNP|RNAV|ILS|LOC|TACAN|NDB|GHTP|IAA|ARA)/i.test(t)) return ["apch","IAP"];
    return null;
  }

  let visible = [];   // flat list of charts currently shown (viewer navigation)
  let cur = -1;

  function render(){
    const set = SETS[setSelect.value];
    const term = q.value.trim().toLowerCase();
    listEl.innerHTML = "";
    visible = [];
    let total = 0;

    for (const icao of set) {
      const ap = CHARTS[icao];
      const sec = document.createElement("div");
      sec.className = "ap" + (ap ? "" : " none");
      const head = document.createElement("div");
      head.className = "aphead";
      head.innerHTML = `<span class="icao">${icao}</span><span class="apname">${ap ? ap.name : ""}</span>`;
      sec.appendChild(head);

      if (!ap) {
        if (term) continue;
        const m = document.createElement("div");
        m.className = "nonemsg";
        m.textContent = "No charts in this document.";
        sec.appendChild(m);
        listEl.appendChild(sec);
        continue;
      }

      const items = ap.charts.filter(c => !term || (icao + " " + c.title).toLowerCase().includes(term));
      if (!items.length) continue;
      const cnt = document.createElement("span");
      cnt.className = "cnt"; cnt.textContent = `${items.length} CHARTS`;
      head.appendChild(cnt);

      const grid = document.createElement("div");
      grid.className = "grid";
      for (const c of items) {
        const idx = visible.push({ icao, ...c }) - 1;
        total++;
        const b = document.createElement("button");
        b.className = "chart";
        const tg = tagOf(c.title);
        b.innerHTML = `<span class="n">${String(c.n).padStart(2,"0")}</span><span class="t"></span>` +
                      (tg ? `<span class="tag ${tg[0]}">${tg[1]}</span>` : "");
        b.querySelector(".t").textContent = c.title;
        b.addEventListener("click", () => openViewer(idx));
        grid.appendChild(b);
      }
      sec.appendChild(grid);
      listEl.appendChild(sec);
    }
    document.getElementById("totalCnt").textContent = total;
    if (!listEl.children.length) listEl.innerHTML = '<div class="nonemsg">No matching charts.</div>';
  }

  const viewer = document.getElementById("viewer");
  const frame = document.getElementById("frame");
  function openViewer(i){
    if (i < 0 || i >= visible.length) return;
    cur = i;
    const c = visible[i];
    const url = BASE + encodeURI(c.file);
    document.getElementById("vTitle").textContent = `${c.icao} — ${c.title}`;
    document.getElementById("vOpen").href = url;
    frame.src = url + "#view=FitH";
    viewer.classList.add("open");
  }
  function closeViewer(){ viewer.classList.remove("open"); frame.src = "about:blank"; cur = -1; }

  document.getElementById("vClose").addEventListener("click", closeViewer);
  document.getElementById("vPrev").addEventListener("click", () => openViewer(cur - 1));
  document.getElementById("vNext").addEventListener("click", () => openViewer(cur + 1));
  document.addEventListener("keydown", e => {
    if (!viewer.classList.contains("open")) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowLeft") openViewer(cur - 1);
    else if (e.key === "ArrowRight") openViewer(cur + 1);
  });

  setSelect.addEventListener("change", () => { localStorage.setItem("chartsSet", setSelect.value); render(); });
  q.addEventListener("input", render);
  render();
</script>
</body>
</html>
